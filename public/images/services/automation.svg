<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" font-family="Helvetica,Arial,sans-serif">
  <rect width="1200" height="900" fill="#000000"/>
  <!-- dotted rows -->
  <g fill="#2A2A2A">
    <circle cx="100" cy="110" r="3"/><circle cx="250" cy="110" r="3"/><circle cx="400" cy="110" r="3"/><circle cx="550" cy="110" r="3"/><circle cx="700" cy="110" r="3"/><circle cx="850" cy="110" r="3"/><circle cx="1000" cy="110" r="3"/><circle cx="1150" cy="110" r="3"/>
    <circle cx="100" cy="820" r="3"/><circle cx="250" cy="820" r="3"/><circle cx="400" cy="820" r="3"/><circle cx="550" cy="820" r="3"/><circle cx="700" cy="820" r="3"/><circle cx="850" cy="820" r="3"/><circle cx="1000" cy="820" r="3"/><circle cx="1150" cy="820" r="3"/>
  </g>
  <!-- connectors -->
  <g fill="none" stroke="#FC362D" stroke-width="5" stroke-dasharray="4 14" stroke-linecap="round">
    <path d="M430 255 C 560 255, 560 475, 690 475"/>
    <path d="M690 500 C 560 500, 560 665, 430 665"/>
    <path d="M430 700 C 600 700, 640 700, 770 700"/>
  </g>
  <!-- node 1: new order -->
  <rect x="110" y="190" width="320" height="130" rx="28" fill="#FFFFFF"/>
  <rect x="140" y="220" width="70" height="70" rx="20" fill="#FC362D"/>
  <rect x="158" y="244" width="34" height="30" rx="6" fill="none" stroke="#0C0407" stroke-width="5"/>
  <path d="M166 244 v-5 a9 9 0 0 1 18 0 v5" fill="none" stroke="#0C0407" stroke-width="5"/>
  <text x="232" y="250" fill="#0C0407" font-size="28" font-weight="700">New order</text>
  <rect x="232" y="270" width="150" height="14" rx="7" fill="#DADBD7"/>
  <!-- node 2: sheet -->
  <rect x="690" y="410" width="330" height="130" rx="28" fill="#FFFFFF"/>
  <rect x="720" y="440" width="70" height="70" rx="20" fill="#0C0407"/>
  <g stroke="#FFFFFF" stroke-width="4" fill="none"><rect x="737" y="457" width="36" height="36" rx="4"/><path d="M737 469 h36 M737 481 h36 M755 457 v36"/></g>
  <text x="812" y="470" fill="#0C0407" font-size="28" font-weight="700">Row added</text>
  <rect x="812" y="490" width="160" height="14" rx="7" fill="#DADBD7"/>
  <!-- node 3: email -->
  <rect x="110" y="600" width="320" height="130" rx="28" fill="#FFFFFF"/>
  <rect x="140" y="630" width="70" height="70" rx="20" fill="#FFE1DE"/>
  <rect x="155" y="650" width="40" height="30" rx="5" fill="none" stroke="#0C0407" stroke-width="5"/>
  <path d="M157 653 l18 14 18 -14" fill="none" stroke="#0C0407" stroke-width="5"/>
  <text x="232" y="660" fill="#0C0407" font-size="28" font-weight="700">Email sent</text>
  <rect x="232" y="680" width="140" height="14" rx="7" fill="#DADBD7"/>
  <!-- node 4: done -->
  <rect x="770" y="640" width="300" height="120" rx="60" fill="#FC362D"/>
  <circle cx="830" cy="700" r="34" fill="#0C0407"/>
  <path d="M814 700 l11 11 22 -23" fill="none" stroke="#FC362D" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="884" y="710" fill="#0C0407" font-size="28" font-weight="700">Team told</text>
  <!-- running pill -->
  <rect x="740" y="180" width="320" height="70" rx="35" fill="none" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="3"/>
  <circle cx="780" cy="215" r="10" fill="#FC362D"/>
  <text x="805" y="224" fill="#FFFFFF" font-size="24" font-weight="700">Running on its own</text>
</svg>
