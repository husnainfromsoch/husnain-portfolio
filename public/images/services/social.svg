<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" font-family="Helvetica,Arial,sans-serif">
  <rect width="1200" height="900" fill="#F2F3F1"/>
  <!-- big circle behind phone -->
  <circle cx="600" cy="520" r="330" fill="#FC362D"/>
  <!-- phone -->
  <g transform="rotate(-6 600 520)">
    <rect x="430" y="150" width="340" height="700" rx="48" fill="#0C0407"/>
    <rect x="448" y="168" width="304" height="664" rx="34" fill="#FFFFFF"/>
    <rect x="555" y="182" width="90" height="20" rx="10" fill="#0C0407"/>
    <!-- profile -->
    <circle cx="510" cy="268" r="38" fill="#FC362D"/>
    <text x="510" y="282" text-anchor="middle" fill="#0C0407" font-size="36" font-weight="700">H</text>
    <rect x="566" y="244" width="140" height="18" rx="9" fill="#0C0407"/>
    <rect x="566" y="276" width="100" height="14" rx="7" fill="#DADBD7"/>
    <rect x="472" y="330" width="256" height="44" rx="22" fill="#0C0407"/>
    <text x="600" y="359" text-anchor="middle" fill="#FFFFFF" font-size="20" font-weight="700">Follow</text>
    <!-- post grid -->
    <rect x="472" y="396" width="80" height="80" rx="10" fill="#FC362D"/>
    <rect x="560" y="396" width="80" height="80" rx="10" fill="#0C0407"/>
    <rect x="648" y="396" width="80" height="80" rx="10" fill="#FFE1DE"/>
    <rect x="472" y="484" width="80" height="80" rx="10" fill="#FFE1DE"/>
    <rect x="560" y="484" width="80" height="80" rx="10" fill="#FC362D"/>
    <rect x="648" y="484" width="80" height="80" rx="10" fill="#0C0407"/>
    <rect x="472" y="572" width="80" height="80" rx="10" fill="#0C0407"/>
    <rect x="560" y="572" width="80" height="80" rx="10" fill="#FFE1DE"/>
    <rect x="648" y="572" width="80" height="80" rx="10" fill="#FC362D"/>
    <rect x="472" y="660" width="80" height="80" rx="10" fill="#FC362D"/>
    <rect x="560" y="660" width="80" height="80" rx="10" fill="#0C0407"/>
    <rect x="648" y="660" width="80" height="80" rx="10" fill="#FFE1DE"/>
  </g>
  <!-- like bubble -->
  <g transform="rotate(6 300 300)">
    <rect x="180" y="250" width="240" height="96" rx="48" fill="#FFFFFF"/>
    <path d="M240 318 c-30 -20 -40 -34 -40 -48 a18 18 0 0 1 40 -6 a18 18 0 0 1 40 6 c0 14 -10 28 -40 48z" fill="#FC362D"/>
    <text x="300" y="309" fill="#0C0407" font-size="28" font-weight="700">New like</text>
  </g>
  <!-- comment bubble -->
  <g transform="rotate(-5 920 640)">
    <rect x="790" y="590" width="290" height="96" rx="48" fill="#0C0407"/>
    <path d="M832 618 h48 a10 10 0 0 1 10 10 v26 a10 10 0 0 1 -10 10 h-30 l-14 12 v-12 h-4 a10 10 0 0 1 -10 -10 v-26 a10 10 0 0 1 10 -10z" fill="#FC362D"/>
    <text x="910" y="648" fill="#FFFFFF" font-size="28" font-weight="700">Comment</text>
  </g>
  <!-- scheduled pill -->
  <rect x="820" y="180" width="250" height="70" rx="35" fill="#FFFFFF" stroke="#0C0407" stroke-width="3"/>
  <circle cx="860" cy="215" r="10" fill="#FC362D"/>
  <text x="884" y="224" fill="#0C0407" font-size="24" font-weight="700">Scheduled</text>
</svg>
